<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — TruthLens Admin</title>
    <meta name="description" content="Admin login for the TruthLens fake news detection platform.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c14;
            --surface: rgba(15,21,38,0.9);
            --border: rgba(255,255,255,0.08);
            --border-active: rgba(99,102,241,0.5);
            --accent: #6366f1;
            --accent-dim: rgba(99,102,241,0.15);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --dim: #475569;
            --real: #10b981;
            --fake: #f43f5e;
            --r: 16px;
            --r-sm: 10px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 70% 50% at 15% 10%, rgba(99,102,241,0.18) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 85% 90%, rgba(139,92,246,0.12) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.1rem 2rem; border-bottom: 1px solid var(--border);
            background: rgba(8,12,20,0.7); backdrop-filter: blur(20px);
        }
        .nav-brand { display: flex; align-items: center; gap: 0.6rem; font-family: 'Outfit', sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .logo-icon { width:30px; height:30px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; }
        .nav-back { color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; padding: 0.4rem 0.85rem; border-radius: var(--r-sm); border: 1px solid var(--border); transition: all 0.2s; }
        .nav-back:hover { color: var(--text); background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.25rem;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-mark {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 1.25rem;
            box-shadow: 0 8px 24px rgba(99,102,241,0.35);
        }

        .login-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            background: linear-gradient(135deg, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 2rem;
            backdrop-filter: blur(24px);
            box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6);
        }

        .form-group { margin-bottom: 1.1rem; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%;
            background: rgba(8,12,20,0.7);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: var(--r-sm);
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.18); }
        input::placeholder { color: var(--dim); }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            padding: 0.85rem;
            border-radius: var(--r-sm);
            font-size: 0.975rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.22s;
            box-shadow: 0 4px 14px rgba(99,102,241,0.3);
            font-family: inherit;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit:hover { background: linear-gradient(135deg, #4f46e5, #3730a3); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .btn-submit.loading .spinner { display:block; }
        .btn-submit.loading .btn-label { display:none; }

        .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; }
        .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
        .divider span { font-size: 0.78rem; color: var(--dim); font-weight: 500; white-space: nowrap; }

        .register-link {
            text-align: center;
            font-size: 0.875rem;
            color: var(--muted);
        }

        .register-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .register-link a:hover { color: #a5b4fc; }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: var(--r-sm);
            font-size: 0.875rem;
            margin-bottom: 1.1rem;
            display: none;
        }

        .alert-error { background: rgba(244,63,94,0.12); border: 1px solid rgba(244,63,94,0.3); color: #fda4af; }
        .alert-success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }

        footer {
            padding: 1.25rem 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--dim);
            border-top: 1px solid var(--border);
        }
        footer a { color: var(--accent); text-decoration: none; }
        footer a:hover { color: #a5b4fc; }
    </style>
</head>
<body>

<nav>
    <a class="nav-brand" href="/">
        <span class="logo-icon">&#128269;</span>
        TruthLens
    </a>
    <a class="nav-back" href="/">&#8592; Back to Detector</a>
</nav>

<main>
    <div class="login-wrap">
        <div class="login-header">
            <div class="brand-mark">&#128272;</div>
            <h1>Admin Login</h1>
            <p>Sign in to manage articles and view analytics</p>
        </div>

        <div class="card">
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="admin@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit" id="loginBtn">
                    <div class="spinner"></div>
                    <span class="btn-label">Sign In</span>
                </button>
            </form>

            <div class="divider"><span>New to TruthLens?</span></div>
            <div class="register-link">
                <a href="/register/">Create an admin account</a>
            </div>
        </div>
    </div>
</main>

<footer>
    TruthLens &bull; <a href="/">Detector</a>
</footer>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        for (const cookie of document.cookie.split(';')) {
            const c = cookie.trim();
            if (c.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(c.slice(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');

    errorAlert.style.display = 'none';
    successAlert.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.classList.add('loading');
    btn.disabled = true;

    try {
        const res = await fetch('/login-view/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.message === 'Login successful') {
            successAlert.textContent = 'Signed in successfully. Redirecting...';
            successAlert.style.display = 'block';
            setTimeout(() => { window.location.href = '/dashboard/'; }, 800);
        } else {
            errorAlert.textContent = data.message || 'Invalid credentials.';
            errorAlert.style.display = 'block';
        }
    } catch (err) {
        errorAlert.textContent = 'Network error. Check that the server is running.';
        errorAlert.style.display = 'block';
    } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
    }
}
</script>
</body>
</html>
