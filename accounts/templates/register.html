<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — TruthLens Admin</title>
    <meta name="description" content="Create an admin account for the TruthLens fake news detection platform.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c14;
            --surface: rgba(15,21,38,0.9);
            --border: rgba(255,255,255,0.08);
            --border-active: rgba(99,102,241,0.5);
            --accent: #6366f1;
            --accent-dim: rgba(99,102,241,0.15);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --dim: #475569;
            --r: 16px;
            --r-sm: 10px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse 70% 50% at 80% 10%, rgba(139,92,246,0.15) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 20% 90%, rgba(6,182,212,0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 2rem; border-bottom: 1px solid var(--border); background: rgba(8,12,20,0.7); backdrop-filter: blur(20px); }
        .nav-brand { display: flex; align-items: center; gap: 0.6rem; font-family: 'Outfit', sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .logo-icon { width:30px; height:30px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:0.9rem; }
        .nav-back { color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; padding: 0.4rem 0.85rem; border-radius: var(--r-sm); border: 1px solid var(--border); transition: all 0.2s; }
        .nav-back:hover { color: var(--text); background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.25rem; }
        .register-wrap { width: 100%; max-width: 460px; }
        .register-header { text-align: center; margin-bottom: 1.75rem; }
        .brand-mark { width:52px; height:52px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; margin:0 auto 1.1rem; box-shadow:0 8px 24px rgba(99,102,241,0.35); }
        .register-header h1 { font-family:'Outfit',sans-serif; font-size:1.65rem; font-weight:700; margin-bottom:0.35rem; background:linear-gradient(135deg,#fff,#cbd5e1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .register-header p { font-size:0.875rem; color:var(--muted); }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:2rem; backdrop-filter:blur(24px); box-shadow:0 24px 48px -12px rgba(0,0,0,0.6); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }
        @media (max-width:460px) { .form-row { grid-template-columns:1fr; } }
        .form-group { margin-bottom:0.9rem; }
        label { display:block; font-size:0.85rem; font-weight:600; color:var(--muted); margin-bottom:0.45rem; }
        input, textarea { width:100%; background:rgba(8,12,20,0.7); border:1px solid rgba(255,255,255,0.09); border-radius:var(--r-sm); color:var(--text); font-family:inherit; font-size:0.925rem; padding:0.7rem 1rem; outline:none; transition:all 0.2s; }
        textarea { resize:vertical; min-height:80px; line-height:1.5; }
        input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,0.18); }
        input::placeholder, textarea::placeholder { color:var(--dim); }
        .btn-submit { width:100%; background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; border:none; padding:0.85rem; border-radius:var(--r-sm); font-size:0.975rem; font-weight:600; cursor:pointer; transition:all 0.22s; box-shadow:0 4px 14px rgba(99,102,241,0.3); font-family:inherit; margin-top:0.5rem; display:flex; align-items:center; justify-content:center; gap:0.5rem; }
        .btn-submit:hover { background:linear-gradient(135deg,#4f46e5,#3730a3); transform:translateY(-1px); box-shadow:0 8px 20px rgba(99,102,241,0.4); }
        .btn-submit:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .spinner { width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; display:none; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .btn-submit.loading .spinner { display:block; }
        .btn-submit.loading .btn-label { display:none; }
        .divider { display:flex; align-items:center; gap:0.75rem; margin:1.25rem 0; }
        .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
        .divider span { font-size:0.78rem; color:var(--dim); font-weight:500; }
        .login-link { text-align:center; font-size:0.875rem; color:var(--muted); }
        .login-link a { color:var(--accent); text-decoration:none; font-weight:600; }
        .login-link a:hover { color:#a5b4fc; }
        .alert { padding:0.75rem 1rem; border-radius:var(--r-sm); font-size:0.875rem; margin-bottom:1rem; display:none; }
        .alert-error { background:rgba(244,63,94,0.12); border:1px solid rgba(244,63,94,0.3); color:#fda4af; }
        .alert-success { background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.3); color:#6ee7b7; }
        footer { padding:1.25rem 2rem; text-align:center; font-size:0.8rem; color:var(--dim); border-top:1px solid var(--border); }
        footer a { color:var(--accent); text-decoration:none; }
    </style>
</head>
<body>

<nav>
    <a class="nav-brand" href="/">
        <span class="logo-icon">&#128269;</span>
        TruthLens
    </a>
    <a class="nav-back" href="/login/">&#8592; Back to Login</a>
</nav>

<main>
    <div class="register-wrap">
        <div class="register-header">
            <div class="brand-mark">&#128100;</div>
            <h1>Create Account</h1>
            <p>Register as an admin to manage articles and access analytics</p>
        </div>

        <div class="card">
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full name *</label>
                        <input type="text" id="name" name="name" placeholder="Jane Smith" required autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" name="phone" placeholder="+1 555 0100" autocomplete="tel">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address *</label>
                    <input type="email" id="email" name="email" placeholder="jane@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" placeholder="Choose a strong password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="123 Main St, City" autocomplete="street-address">
                </div>

                <div class="form-group">
                    <label for="note">Note (optional)</label>
                    <textarea id="note" name="note" placeholder="Any additional information..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="registerBtn">
                    <div class="spinner"></div>
                    <span class="btn-label">Create Account</span>
                </button>
            </form>

            <div class="divider"><span>Already have an account?</span></div>
            <div class="login-link"><a href="/login/">Sign in instead</a></div>
        </div>
    </div>
</main>

<footer>
    TruthLens &bull; <a href="/">Detector</a>
</footer>

<script>
function getCookie(name) {
    let v = null;
    if (document.cookie) {
        for (const c of document.cookie.split(';')) {
            const t = c.trim();
            if (t.startsWith(name + '=')) { v = decodeURIComponent(t.slice(name.length + 1)); break; }
        }
    }
    return v;
}

async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');

    errorAlert.style.display = 'none';
    successAlert.style.display = 'none';

    btn.classList.add('loading');
    btn.disabled = true;

    const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim(),
        note: document.getElementById('note').value.trim()
    };

    try {
        const res = await fetch('/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
            successAlert.textContent = 'Account created. Redirecting to login...';
            successAlert.style.display = 'block';
            setTimeout(() => { window.location.href = '/login/'; }, 1000);
        } else {
            errorAlert.textContent = data.message || 'Registration failed.';
            errorAlert.style.display = 'block';
        }
    } catch (err) {
        errorAlert.textContent = 'Network error. Check that the server is running.';
        errorAlert.style.display = 'block';
    } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
    }
}
</script>
</body>
</html>
